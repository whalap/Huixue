<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的账号 · 慧学学习网络</title>
<meta name="theme-color" content="#14110c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<script src="account.js"></script>
<script src="site-nav.js" defer></script>
<style>
:root{
  --bg:#0E1013; --card:#1A1F29; --card2:#202632; --line:#2A3140; --line2:#374152;
  --ink:#F2F4F8; --ink2:#A7B0C0; --ink3:#6E7889;
  --gold:#C9A227; --gold-soft:#3A3115; --gold-line:#5A4A1E;
  --red:#C0392B; --green:#2E8B57;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.65; -webkit-font-smoothing:antialiased; padding-bottom:60px;}
.wrap{max-width:560px; margin:0 auto; padding:0 20px;}
h2.sec{font-size:19px; margin:26px 0 16px; display:flex; align-items:center; gap:11px;}
h2.sec .no{background:var(--gold); color:#1A1408; font-size:12px; font-weight:700; border-radius:6px; padding:2px 9px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; margin-bottom:16px;}
.tabs{display:flex; gap:8px; margin-bottom:18px;}
.tab{flex:1; text-align:center; padding:10px; border:1px solid var(--line2); border-radius:10px;
  font-size:14px; font-weight:600; color:var(--ink2); cursor:pointer; background:var(--card2);}
.tab.active{background:linear-gradient(135deg,#C9A227,#A8831B); color:#1A1408; border-color:transparent;}
label{display:block; font-size:13px; color:var(--ink2); margin:14px 0 6px;}
input{width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line2);
  background:#0E1116; color:var(--ink); font-size:14px; outline:none;}
input:focus{border-color:var(--gold-line);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none;
  font-size:14px; font-weight:700; border-radius:10px; padding:12px 18px; width:100%;
  border:1px solid var(--line2); background:var(--card2); color:var(--ink); cursor:pointer; margin-top:18px;}
.btn.primary{background:linear-gradient(135deg,#C9A227,#A8831B); color:#1A1408; border-color:transparent;}
.btn.ghost{background:transparent;}
.btn:hover{filter:brightness(1.06);}
.err{color:#E0A87A; font-size:13px; margin-top:12px; min-height:18px;}
.ok{color:#8FD0A0; font-size:13px; margin-top:12px; min-height:18px;}
.profile .row{display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px dashed var(--line2); font-size:14px;}
.profile .row span:first-child{color:var(--ink3);}
.profile .row span:last-child{color:var(--ink); font-weight:600;}
.note{background:#2A1A12; border:1px solid #5A3A22; color:#E0A87A; border-radius:11px;
  padding:12px 15px; font-size:12.8px; line-height:1.8; margin-top:14px;}
.note b{color:#F0C08A;}
.hint{font-size:12.5px; color:var(--ink3); margin-top:10px; line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <h2 class="sec"><span class="no">👤</span>我的账号</h2>
  <div id="app"></div>
</div>

<script>
(function () {
  'use strict';
  var app = document.getElementById('app');

  function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmt(ts){ if(!ts) return '—'; var d=new Date(ts); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

  function renderLogin() {
    app.innerHTML =
      '<div class="card">' +
        '<div class="tabs">' +
          '<div class="tab active" id="tab-login">登录</div>' +
          '<div class="tab" id="tab-reg">注册</div>' +
        '</div>' +
        '<div id="form-box"></div>' +
      '</div>' +
      '<div class="hint">账号数据保存在<b>当前设备浏览器</b>本地。开启云服务后，可升级为跨设备云端同步（换手机/电脑也能看见同一份学习档案）。</div>';

    var mode = 'login';
    function drawForm() {
      if (mode === 'login') {
        document.getElementById('form-box').innerHTML =
          '<label>邮箱</label><input id="f-email" type="email" placeholder="you@example.com" autocomplete="username">' +
          '<label>密码</label><input id="f-pw" type="password" placeholder="至少 6 位" autocomplete="current-password">' +
          '<button class="btn primary" id="f-go">登录</button>' +
          '<div class="err" id="f-msg"></div>';
        document.getElementById('f-go').onclick = submitLogin;
      } else {
        document.getElementById('form-box').innerHTML =
          '<label>昵称</label><input id="f-nick" type="text" placeholder="例如：小明" maxlength="20">' +
          '<label>邮箱</label><input id="f-email" type="email" placeholder="you@example.com" autocomplete="username">' +
          '<label>密码</label><input id="f-pw" type="password" placeholder="至少 6 位" autocomplete="new-password">' +
          '<button class="btn primary" id="f-go">注册并登录</button>' +
          '<div class="err" id="f-msg"></div>';
        document.getElementById('f-go').onclick = submitReg;
      }
    }
    document.getElementById('tab-login').onclick = function(){ mode='login'; this.classList.add('active'); document.getElementById('tab-reg').classList.remove('active'); drawForm(); };
    document.getElementById('tab-reg').onclick   = function(){ mode='reg';   this.classList.add('active'); document.getElementById('tab-login').classList.remove('active'); drawForm(); };
    drawForm();

    function submitLogin() {
      var msg = document.getElementById('f-msg'); msg.textContent = '';
      Account.login({ email: document.getElementById('f-email').value, password: document.getElementById('f-pw').value })
        .then(function(){ renderProfile(); }).catch(function(e){ msg.textContent = (e&&e.msg)||'登录失败'; });
    }
    function submitReg() {
      var msg = document.getElementById('f-msg'); msg.textContent = '';
      Account.register({ nick: document.getElementById('f-nick').value, email: document.getElementById('f-email').value, password: document.getElementById('f-pw').value })
        .then(function(){ renderProfile(); }).catch(function(e){ msg.textContent = (e&&e.msg)||'注册失败'; });
    }
  }

  function renderProfile() {
    var u = Account.current();
    if (!u) { renderLogin(); return; }
    app.innerHTML =
      '<div class="card profile">' +
        '<div class="row"><span>昵称</span><span>' + esc(u.nick) + '</span></div>' +
        '<div class="row"><span>邮箱</span><span>' + esc(u.email) + '</span></div>' +
        '<div class="row"><span>注册时间</span><span>' + fmt(u.createdAt) + '</span></div>' +
        '<div class="row"><span>登录状态</span><span style="color:#8FD0A0">已登录（本机）</span></div>' +
        '<button class="btn" id="p-nick">修改昵称</button>' +
        '<button class="btn ghost" id="p-out">退出登录</button>' +
      '</div>' +
      '<div class="note"><b>关于同步：</b>当前为本地账号，学习记录仍按设备分别保存。' +
      '待开启云服务后，本账号可与云端打通，实现「换设备也能看见同一份学习档案」以及打卡排名。' +
      '届时只需把本账号系统和云端对接，页面无需大改。</div>';

    document.getElementById('p-out').onclick = function(){ Account.logout(); renderLogin(); };
    document.getElementById('p-nick').onclick = function(){
      var n = prompt('输入新昵称（1–20 字）：', u.nick);
      if (n == null) return;
      try { Account.setNick(n); renderProfile(); } catch(e){ alert((e&&e.msg)||'修改失败'); }
    };
  }

  if (Account.isLoggedIn()) renderProfile(); else renderLogin();
})();
</script>
</body>
</html>
